# Phosphor — YASB (%USERPROFILE%\.config\yasb\config.yaml)
# Original bar layout (not adapted from a community theme) using the same widget schema
# proven in the catppuccin example: `glazewm.workspaces.GlazewmWorkspacesWidget`
# (namespace `glazewm.*`, no '-widget' suffix on its CSS class) alongside `yasb.*`
# widgets (which DO get a '-widget' suffix on their CSS class — see styles.css). Only
# Segoe UI / Segoe Fluent Icons are used — both ship with Windows 11, no Nerd Font
# required. Weather uses `yasb.open_meteo.OpenMeteoWidget`, which needs no API key.
watch_stylesheet: true
watch_config: true
debug: false

bars:
  status-bar:
    enabled: true
    screens: ['*']
    class_name: 'yasb-bar'
    alignment:
      position: 'top'
      center: false
    blur_effect:
      enabled: true
      dark_mode: true
      round_corners: false
    # windows_app_bar: registers the bar as a Windows AppBar (same mechanism as the
    # native taskbar), reserving its own screen strip. Without this, GlazeWM tiles the
    # YASB window like any other app and stretches it across the whole monitor.
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: '100%'
      height: 32
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left: ['glazewm_workspaces', 'home']
      center: ['clock']
      right: ['systray', 'cpu', 'memory', 'open_meteo', 'volume', 'taskbar', 'power_menu']

widgets:
  # Namespace note: this widget lives under 'glazewm.workspaces', not 'yasb.*' like the
  # rest — its CSS class ('glazewm-workspaces') has NO '-widget' suffix.
  glazewm_workspaces:
    type: 'glazewm.workspaces.GlazewmWorkspacesWidget'
    options:
      offline_label: 'GlazeWM offline'
      hide_if_offline: false
      monitor_exclusive: true

  home:
    type: 'yasb.home.HomeWidget'
    options:
      label: '<span></span>'
      menu_list:
        - { title: 'Home', path: '~' }
        - { title: 'Downloads', path: '~\Downloads' }
        - { title: 'Documents', path: '~\Documents' }
        - { title: 'Pictures', path: '~\Pictures' }
      system_menu: true
      power_menu: true
      blur: true
      round_corners: true
      round_corners_type: 'normal'
      border_color: 'System'
      alignment: 'center'

  # Replaces the native taskbar (hidden by OttoRice): open apps rendered directly in the
  # YASB bar, with icon and click-to-focus/minimize.
  taskbar:
    type: 'yasb.taskbar.TaskbarWidget'
    options:
      animation:
        enabled: true
      icon_size: 16
      ignore_apps:
        processes: []
        titles: []
        classes: []

  clock:
    type: 'yasb.clock.ClockWidget'
    options:
      label: '{%a, %d %b %H:%M}'
      label_alt: '{%A, %d %B %Y %H:%M}'
      timezones: []
      calendar:
        blur: true
        round_corners: true
        alignment: 'center'
        direction: 'down'
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: 'toggle_calendar'
        on_middle: 'toggle_label'
        on_right: 'context_menu'

  systray:
    type: 'yasb.systray.SystrayWidget'
    options:
      class_name: 'systray'
      label_collapsed: ''
      label_expanded: ''
      label_position: 'right'
      pin_click_modifier: 'ctrl'
      show_unpinned: false
      show_battery: false
      show_volume: false
      icon_size: 16
      use_hook: true
      show_in_popup: true
      icons_per_row: 5
      popup:
        blur: true
        round_corners: true
        round_corners_type: 'normal'
        border_color: 'None'
        alignment: 'center'
        direction: 'down'
        offset_top: 6
        offset_left: 0

  open_meteo:
    type: 'yasb.open_meteo.OpenMeteoWidget'
    options:
      label: '<span></span>{temp}'
      label_alt: '{location}: Min {min_temp}, Max {max_temp}, Humidity {humidity}'
      tooltip: true
      update_interval: 600
      hide_decimal: true
      units: 'metric'
      callbacks:
        on_left: 'toggle_card'
        on_middle: 'do_nothing'
        on_right: 'toggle_label'
      weather_card:
        blur: true
        alignment: 'right'
        direction: 'down'
        icon_size: 32
        show_hourly_forecast: true
        time_format: '24h'

  volume:
    type: 'yasb.volume.VolumeWidget'
    options:
      label: '<span>{icon}</span>'
      label_alt: '<span>{icon}</span>{level}'
      tooltip: true
      icons:
        muted: ''
        '10': ''
        '30': ''
        '60': ''
        '100': ''
      callbacks:
        on_left: 'toggle_volume_menu'
        on_right: 'toggle_mute'

  cpu:
    type: 'yasb.cpu.CpuWidget'
    options:
      label: '<span></span> {info[percent][total]}%'
      label_alt: '<span></span> {info[freq][current]} MHz'
      update_interval: 2000
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
      callbacks:
        on_left: 'toggle_menu'
        on_middle: 'do_nothing'
        on_right: 'toggle_label'

  memory:
    type: 'yasb.memory.MemoryWidget'
    options:
      label: '<span></span> {virtual_mem_free}'
      label_alt: '<span></span> VIRT: {virtual_mem_percent}% SWAP: {swap_mem_percent}%'
      update_interval: 5000
      callbacks:
        on_left: 'toggle_menu'
        on_middle: 'do_nothing'
        on_right: 'toggle_label'
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60

  power_menu:
    type: 'yasb.power_menu.PowerMenuWidget'
    options:
      label: '<span></span>'
      uptime: true
      show_user: true
      menu_style: 'popup'
      popup:
        blur: true
        round_corners: true
        round_corners_type: 'normal'
        border_color: 'System'
        alignment: 'right'
        direction: 'down'
        offset_top: 6
        offset_left: 0
      profile_image_size: 64
      buttons:
        lock: ['', 'Lock']
        signout: ['', 'Sign out']
        sleep: ['', 'Sleep']
        hibernate: ['', 'Hibernate']
        restart: ['', 'Restart']
        shutdown: ['', 'Shut down']
        cancel: ['', 'Cancel']
