# Catppuccin Everywhere — YASB Reborn (%USERPROFILE%\.config\yasb\config.yaml)
# Paleta alternativa "Catppuccin Frappé" (palettes/frappe, seção 13 da doc "OttoRice").
# Este arquivo é idêntico ao configs/yasb/config.yaml padrão — a paleta só muda cores
# (styles.css), nunca layout/comportamento de widgets. Copiado aqui (em vez de deixar a
# paleta reaproveitar o padrão) porque o override de "yasb" é por PASTA inteira: se este
# arquivo não existisse aqui, a pasta da paleta substituiria o config.yaml padrão por
# nada, quebrando a barra.
#
# Únicas mudanças de conteúdo em relação ao original: adicionado 'glazewm_workspaces'
# (namespace 'glazewm.*', não 'yasb.*') pra indicar os workspaces do GlazeWM — o tema
# original não tem nenhum widget de window manager — e mantido o 'taskbar' que já
# substituía a nativa nas versões anteriores deste exemplo.
watch_stylesheet: true
watch_config: true
debug: false

bars:
  status-bar:
    enabled: true
    screens: ['*']
    class_name: 'yasb-bar'
    alignment:
      position: 'top'
      center: false
    blur_effect:
      enabled: true
      dark_mode: true
      round_corners: false
    # windows_app_bar: a barra se registra como AppBar do Windows (mesmo mecanismo da
    # taskbar nativa) e reserva a própria faixa de tela — sem isso o GlazeWM tenta blocar
    # (tiling) a janela do YASB como se fosse um app comum, esticando-a pra ocupar o
    # monitor inteiro no multi-monitor (bug real encontrado em dogfooding, ver doc).
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: '100%'
      height: 32
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left: ['glazewm_workspaces', 'home', 'quick_launch']
      center: ['clock']
      right: ['systray', 'cpu', 'memory', 'open_meteo', 'volume', 'taskbar', 'notifications', 'power_menu']

widgets:
  # Atenção: o namespace deste widget é 'glazewm.workspaces', não 'yasb.*' como os demais.
  glazewm_workspaces:
    type: 'glazewm.workspaces.GlazewmWorkspacesWidget'
    options:
      offline_label: 'GlazeWM offline'
      hide_if_offline: false
      monitor_exclusive: true

  home:
    type: 'yasb.home.HomeWidget'
    options:
      label: '<span></span>'
      menu_list:
        - { title: 'Pasta do usuário', path: '~' }
        - { title: 'Downloads', path: '~\Downloads' }
        - { title: 'Documentos', path: '~\Documents' }
        - { title: 'Imagens', path: '~\Pictures' }
      system_menu: true
      power_menu: true
      blur: true
      round_corners: true
      round_corners_type: 'normal'
      border_color: 'System'
      alignment: 'center'

  quick_launch:
    type: 'yasb.quick_launch.QuickLaunchWidget'
    options:
      label: '<span></span>'
      search_placeholder: 'Buscar aplicativos...'
      max_results: 30
      show_icons: true
      icon_size: 16
      compact_text: true
      providers:
        apps:
          enabled: true
          prefix: '*'
          priority: 0
          show_recent: true
          max_recent: 5
          show_description: true
      popup:
        width: 720
        height: 480
        blur: true
        round_corners: true
        round_corners_type: 'normal'
        border_color: 'system'
        dark_mode: true
      callbacks:
        on_left: 'toggle_quick_launch'
      keybindings:
        - keys: 'alt+space'
          action: 'toggle_quick_launch'
          screen: 'primary'

  # Substitui a taskbar nativa (oculta pelo OttoRice): mostra os apps abertos direto na
  # barra do YASB, com ícone e clique pra alternar/minimizar.
  taskbar:
    type: 'yasb.taskbar.TaskbarWidget'
    options:
      animation:
        enabled: true
      icon_size: 16
      ignore_apps:
        processes: []
        titles: []
        classes: []

  clock:
    type: 'yasb.clock.ClockWidget'
    options:
      label: '{%a, %d %b %H:%M}'
      label_alt: '{%A, %d %B %Y %H:%M}'
      timezones: []
      calendar:
        blur: true
        round_corners: true
        alignment: 'center'
        direction: 'down'
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: 'toggle_calendar'
        on_middle: 'toggle_label'
        on_right: 'context_menu'

  systray:
    type: 'yasb.systray.SystrayWidget'
    options:
      class_name: 'systray'
      label_collapsed: ''
      label_expanded: ''
      label_position: 'right'
      pin_click_modifier: 'ctrl'
      show_unpinned: false
      show_battery: false
      show_volume: false
      icon_size: 16
      use_hook: true
      show_in_popup: true
      icons_per_row: 5
      popup:
        blur: true
        round_corners: true
        round_corners_type: 'normal'
        border_color: 'None'
        alignment: 'center'
        direction: 'down'
        offset_top: 6
        offset_left: 0

  open_meteo:
    type: 'yasb.open_meteo.OpenMeteoWidget'
    options:
      label: '<span></span>{temp}'
      label_alt: '{location}: Min {min_temp}, Max {max_temp}, Umidade {humidity}'
      tooltip: true
      update_interval: 600
      hide_decimal: true
      units: 'metric'
      callbacks:
        on_left: 'toggle_card'
        on_middle: 'do_nothing'
        on_right: 'toggle_label'
      weather_card:
        blur: true
        alignment: 'right'
        direction: 'down'
        icon_size: 32
        show_hourly_forecast: true
        time_format: '24h'

  volume:
    type: 'yasb.volume.VolumeWidget'
    options:
      label: '<span>{icon}</span>'
      label_alt: '<span>{icon}</span>{level}'
      tooltip: true
      icons:
        muted: ''
        '10': ''
        '30': ''
        '60': ''
        '100': ''
      callbacks:
        on_left: 'toggle_volume_menu'
        on_right: 'toggle_mute'

  cpu:
    type: 'yasb.cpu.CpuWidget'
    options:
      label: '<span></span> {info[percent][total]}%'
      label_alt: '<span></span> {info[freq][current]} MHz'
      update_interval: 2000
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
      callbacks:
        on_left: 'toggle_menu'
        on_middle: 'do_nothing'
        on_right: 'toggle_label'

  memory:
    type: 'yasb.memory.MemoryWidget'
    options:
      label: '<span></span> {virtual_mem_free}'
      label_alt: '<span></span> VIRT: {virtual_mem_percent}% SWAP: {swap_mem_percent}%'
      update_interval: 5000
      callbacks:
        on_left: 'toggle_menu'
        on_middle: 'do_nothing'
        on_right: 'toggle_label'
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60

  power_menu:
    type: 'yasb.power_menu.PowerMenuWidget'
    options:
      label: '<span></span>'
      uptime: true
      show_user: true
      menu_style: 'popup'
      popup:
        blur: true
        round_corners: true
        round_corners_type: 'normal'
        border_color: 'System'
        alignment: 'right'
        direction: 'down'
        offset_top: 6
        offset_left: 0
      profile_image_size: 64
      buttons:
        lock: ['', 'Bloquear']
        signout: ['', 'Sair']
        sleep: ['', 'Suspender']
        hibernate: ['', 'Hibernar']
        restart: ['', 'Reiniciar']
        shutdown: ['', 'Desligar']
        cancel: ['', 'Cancelar']

  notifications:
    type: 'yasb.notifications.NotificationsWidget'
    options:
      label: '<span></span>'
      label_alt: '{count} notificações'
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: 'toggle_notification'
        on_right: 'do_nothing'
        on_middle: 'do_nothing'
